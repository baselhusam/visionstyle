name: TestPyPI

# Manual dry run of a release: builds the current commit as X.Y.Z.devN, publishes it to
# test.pypi.org, then installs it from there into a clean venv and smoke-tests it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Set a unique dev version
        # TestPyPI never accepts the same version twice, so every run gets its own .devN.
        id: version
        run: |
          base=$(grep -E '^__version__' src/visionstyle/__init__.py | cut -d'"' -f2)
          version="${base}.dev${{ github.run_number }}"
          sed -i "s/^__version__ = \".*\"/__version__ = \"${version}\"/" src/visionstyle/__init__.py
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm ci && npm run build
        working-directory: studio
      - run: uv build
      - name: Check distributions
        run: |
          uvx twine check --strict dist/*
          unzip -l dist/*.whl | grep -q 'visionstyle/studio/static/index.html'
          unzip -l dist/*.whl | grep -q 'visionstyle/presets/cinematic.yaml'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # TestPyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # lets a re-run of the same run number pass

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the wheel from TestPyPI
        # Only visionstyle comes from TestPyPI; its dependencies come from PyPI in the next step, so
        # look-alike packages on TestPyPI can't be picked up.
        run: |
          for i in $(seq 1 20); do
            pip download --no-deps --only-binary :all: -d wheel \
              --index-url https://test.pypi.org/simple/ "visionstyle==${VERSION}" && break
            echo "not on the index yet, retrying in 15s"; sleep 15
          done
          ls wheel/*.whl
      - name: Install into a clean venv
        run: |
          python -m venv venv
          venv/bin/pip install "$(ls wheel/*.whl)[studio]"
      - name: Smoke test
        run: |
          venv/bin/python -c "import visionstyle as vs; assert vs.__version__ == '${VERSION}', vs.__version__"
          venv/bin/visionstyle presets list
          venv/bin/visionstyle gallery -o gallery.png --tile-width 320
          venv/bin/visionstyle studio --no-browser --port 8420 &
          for i in $(seq 1 30); do curl -sf localhost:8420/api/info && break; sleep 1; done
          curl -sf localhost:8420/ | grep -q '<div id="root">'
