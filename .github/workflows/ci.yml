name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (core + studio + dev)
        run: uv sync --python ${{ matrix.python }} --extra studio --group dev
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q -p no:warnings --cov=visionstyle --cov-report=term-missing:skip-covered
      - name: Gallery smoke render
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run visionstyle gallery -o gallery.png --tile-width 480
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: gallery
          path: gallery.png

  studio:
    name: Studio frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Check schema.json is current
        run: |
          uv sync --group dev
          uv run visionstyle schema -o /tmp/schema.json
          diff <(python3 -m json.tool /tmp/schema.json) <(python3 -m json.tool studio/schema.json) \
            || (echo "::error::studio/schema.json is stale — run: uv run visionstyle schema -o studio/schema.json && (cd studio && npm run gen:types)"; exit 1)
      - run: npm ci
        working-directory: studio
      - run: npm run lint
        working-directory: studio
      - run: npm test
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - name: Serve built app and hit the API
        run: |
          uv sync --extra studio
          uv run visionstyle studio --no-browser --port 8420 &
          for i in $(seq 1 30); do curl -sf localhost:8420/api/info && break; sleep 1; done
          curl -sf localhost:8420/ | grep -q '<div id="root">'
          curl -sf -X POST localhost:8420/api/detect -H 'content-type: application/json' -d '{"image_id":"sample:street"}' | grep -q detections

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [python, studio]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci && npm run build
        working-directory: studio
      - run: uv build
      - name: Wheel contains the studio bundle and presets
        run: |
          unzip -l dist/*.whl | grep -q 'visionstyle/studio/static/index.html'
          unzip -l dist/*.whl | grep -q 'visionstyle/presets/cinematic.yaml'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
